[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locugard"
version = "0.2.0"
description = "Embeddable multi-level WebAuthn/passkey authentication, strictness policies, and action-approval guard for self-hosted Python apps and AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "skvipers" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/skvipers/locugard"
Repository = "https://github.com/skvipers/locugard"
Issues = "https://github.com/skvipers/locugard/issues"

[project.optional-dependencies]
web = [
    "starlette>=1.0,<2",
    "uvicorn>=0.54,<1",
    "webauthn>=3.0,<4",
]

[tool.setuptools.packages.find]
include = ["locugard*"]

[tool.setuptools.package-data]
locugard = ["assets/*"]
